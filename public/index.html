<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>package-hallucination-checker</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1d23; background: #ffffff; }
  h1 { font-size: 20px; }
  p.subtitle { color: #565b66; font-size: 14px; margin-top: -8px; }
  textarea { width: 100%; height: 220px; font-family: monospace; font-size: 13px; box-sizing: border-box; padding: 10px; }
  button { margin-top: 12px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #output { margin-top: 24px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  #output div { padding: 1px 0; }
  .verified { color: #1e8e5a; }
  .low-trust { color: #b8860b; }
  .missing { color: #c0392b; font-weight: bold; }
  .unknown { color: #2451b8; }
  #summary { margin-top: 14px; font-weight: bold; }
</style>
</head>
<body>
  <h1>package-hallucination-checker</h1>
  <p class="subtitle">Paste a package.json below to verify every dependency actually exists on npm.</p>

  <textarea id="input" placeholder='{"dependencies": {"express": "^4.0.0"}}'></textarea>
  <br>
  <button id="run">Check packages</button>

  <div id="output"></div>
  <div id="summary"></div>

  <script>
    function renderResults(results) {
      const output = document.getElementById("output");
      output.textContent = "";
      for (const r of results) {
        const row = document.createElement("div");

        const label = document.createElement("span");
        label.className = r.status;
        label.textContent = r.label.padEnd(10);
        row.appendChild(label);

        let text = r.name;
        if (r.detail) text += `  (${r.detail})`;
        row.appendChild(document.createTextNode(text));

        output.appendChild(row);
      }
    }

    function formatSummary(summary) {
      const { verified, lowTrust, missing, unknown } = summary;
      const parts = [`${verified} verified`, `${lowTrust} low-trust`, `${missing} missing`];
      if (unknown > 0) parts.push(`${unknown} unknown`);
      return parts.join(", ");
    }

    document.getElementById("run").addEventListener("click", async () => {
      const output = document.getElementById("output");
      const summaryEl = document.getElementById("summary");
      output.textContent = "Checking...";
      summaryEl.textContent = "";

      let body;
      try {
        body = JSON.parse(document.getElementById("input").value);
      } catch {
        output.textContent = "That's not valid JSON.";
        return;
      }

      let data;
      try {
        const res = await fetch("/api/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        data = await res.json();
      } catch {
        output.textContent = "Could not reach the server. Check your connection and try again.";
        return;
      }

      if (data.error) {
        output.textContent = `Error: ${data.error}`;
        return;
      }

      renderResults(data.results);
      summaryEl.textContent = formatSummary(data.summary);
    });
  </script>
</body>
</html>
