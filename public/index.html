<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>package-hallucination-checker</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1d23; background: #ffffff; }
  h1 { font-size: 20px; }
  p.subtitle { color: #565b66; font-size: 14px; margin-top: -8px; }
  textarea { width: 100%; height: 220px; font-family: monospace; font-size: 13px; box-sizing: border-box; padding: 10px; }
  button { margin-top: 12px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #output { margin-top: 24px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  .verified { color: #1e8e5a; }
  .low-trust { color: #b8860b; }
  .missing { color: #c0392b; font-weight: bold; }
  .unknown { color: #2451b8; }
  #summary { margin-top: 14px; font-weight: bold; }
</style>
</head>
<body>
  <h1>package-hallucination-checker</h1>
  <p class="subtitle">Paste a package.json below to verify every dependency actually exists on npm.</p>

  <textarea id="input" placeholder='{"dependencies": {"express": "^4.0.0"}}'></textarea>
  <br>
  <button id="run">Check packages</button>

  <div id="output"></div>
  <div id="summary"></div>

  <script>
    const CLASS_BY_STATUS = {
      verified: "verified",
      "low-trust": "low-trust",
      missing: "missing",
      unknown: "unknown",
    };
    const LABEL_BY_STATUS = {
      verified: "VERIFIED",
      "low-trust": "LOW-TRUST",
      missing: "MISSING",
      unknown: "UNKNOWN",
    };

    document.getElementById("run").addEventListener("click", async () => {
      const output = document.getElementById("output");
      const summaryEl = document.getElementById("summary");
      output.textContent = "Checking...";
      summaryEl.textContent = "";

      let body;
      try {
        body = JSON.parse(document.getElementById("input").value);
      } catch {
        output.textContent = "That's not valid JSON.";
        return;
      }

      const res = await fetch("/api/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      const data = await res.json();
      if (!res.ok) {
        output.textContent = `Error: ${data.error}`;
        return;
      }

      output.innerHTML = data.results
        .map((r) => {
          const label = LABEL_BY_STATUS[r.status];
          const cls = CLASS_BY_STATUS[r.status];
          const extra = r.status === "low-trust" ? `  (${r.downloads} weekly downloads)` : "";
          return `<span class="${cls}">${label}</span>    ${r.name}${extra}`;
        })
        .join("\n");

      const { verified, lowTrust, missing, unknown } = data.summary;
      let text = `${verified} verified, ${lowTrust} low-trust, ${missing} missing`;
      if (unknown > 0) text += `, ${unknown} unknown`;
      summaryEl.textContent = text;
    });
  </script>
</body>
</html>
